<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IIOU Testnet validation</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><style>body{font-family:system-ui;background:#07101e;color:#fff;margin:0;padding:24px}.box{max-width:560px;margin:auto;background:#0e1a2c;border:1px solid #223553;border-radius:20px;padding:24px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#37d4b2;font-weight:800}.msg{margin:16px 0;color:#9db0c9;line-height:1.5}</style></head><body><div class="box"><h1>IIOU Testnet validation</h1><p class="msg">Authenticate with Pi, then run the one-time validation for this Testnet account.</p><div id="msg" class="msg">Ready.</div><button id="go">Continue with Pi</button><button id="run" style="display:none;margin-top:12px">Run validation</button></div><script>Pi.init({version:'2.0',sandbox:true});let token=null;const msg=document.getElementById('msg');async function req(method){const r=await fetch('/api/a2u',{method,headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}document.getElementById('go').onclick=async()=>{try{const a=await Pi.authenticate(['username'],()=>{});token=a.accessToken;document.getElementById('go').style.display='none';const d=await req('GET');msg.textContent=d.payout?`Status: ${d.payout.status}`:`Eligible. Progress ${d.uniqueWalletsCompleted||0}/${d.targetUniqueWallets||5}`;if(d.eligible)document.getElementById('run').style.display='block'}catch(e){msg.textContent=e.message}};document.getElementById('run').onclick=async()=>{try{document.getElementById('run').disabled=true;msg.textContent='Processing…';const d=await req('POST');msg.textContent=`Completed. Progress ${d.uniqueWalletsCompleted||0}/${d.targetUniqueWallets||5}`;document.getElementById('run').style.display='none'}catch(e){msg.textContent=e.message;document.getElementById('run').disabled=false}};</script></body></html>
