<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101e"><title>IIOU Activity</title><script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
:root{--bg:#07101e;--panel:#0e1a2c;--line:#223553;--text:#f7f9fc;--muted:#9db0c9;--accent:#37d4b2;--blue:#66a7ff;--warn:#ffd166;--danger:#ff8592}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:760px;margin:auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-size:24px;font-weight:900}.pill{border:1px solid var(--line);padding:7px 10px;border-radius:999px;color:var(--warn);font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}.muted{color:var(--muted)}button,input,textarea{font:inherit}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;margin-top:10px}.primary{background:var(--accent);color:#06121d}.secondary{background:#1a3150;color:var(--text);border:1px solid #2b4a71}.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.danger{background:#3b1c29;color:#ffc3cc;border:1px solid #653044}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.amount{font-size:34px;font-weight:900}.status{text-transform:uppercase;font-size:12px;font-weight:900;color:var(--accent)}.list{display:grid;gap:10px}.item{padding:15px;border:1px solid var(--line);border-radius:16px;background:#0a1728}.item b{display:block;margin-bottom:4px}.timeline{border-left:2px solid #29405f;margin-left:9px;padding-left:16px}.event{position:relative;padding:0 0 18px}.event:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--blue);left:-22px;top:5px}.event small{color:var(--muted)}textarea,input{width:100%;background:#081524;color:var(--text);border:1px solid #29405f;border-radius:13px;padding:12px;margin-top:8px}.hidden{display:none}.notice{padding:12px;border:1px solid var(--line);border-radius:14px;color:var(--muted);margin:12px 0}.notice.err{color:#ffc3cc;border-color:#653044}.back{color:var(--muted);text-decoration:none}.due.overdue{color:var(--danger);font-weight:800}.due.soon{color:var(--warn);font-weight:800}
</style></head>
<body><main class="shell"><div class="top"><div><div class="brand">IIOU Activity</div><div class="muted">Details, timeline and settlement history</div></div><span class="pill">TESTNET</span></div><a class="back" href="/">← Back to IIOU</a>
<section id="loginCard" class="card"><h2>Private activity center</h2><p class="muted">Authenticate with Pi to view only IOUs connected to your verified account.</p><button id="login" class="btn primary">Continue with Pi</button></section>
<section id="app" class="hidden"><div id="notice"></div><div id="picker" class="card"><h2>Your IOUs</h2><div id="items" class="list"></div></div><div id="detail" class="hidden"></div></section></main>
<script>
Pi.init({version:'2.0',sandbox:true});const s={token:null,user:null,ious:[],current:null};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const fmt=n=>`${Number(n||0).toLocaleString(undefined,{maximumFractionDigits:7})} π`;const headers=()=>({'Content-Type':'application/json','Authorization':`Bearer ${s.token}`});
function msg(t,e=false){$('notice').innerHTML=t?`<div class="notice ${e?'err':''}">${esc(t)}</div>`:''}async function api(url,o={}){const r=await fetch(url,{...o,headers:{...headers(),...(o.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d}
$('login').onclick=async()=>{try{const a=await Pi.authenticate(['username','payments'],()=>{});s.token=a.accessToken;const me=await api('/api/auth',{method:'POST'});s.user=me.user;$('loginCard').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){alert(e.message)}};
async function load(){const d=await api('/api/ious');s.ious=d.ious||[];renderList()}
function dueClass(i){if(!i.dueDate||['settled','declined','cancelled'].includes(i.status))return'';const x=new Date(i.dueDate+'T23:59:59'),now=new Date(),days=(x-now)/86400000;if(days<0)return'overdue';if(days<=3)return'soon';return''}
function renderList(){if(!s.ious.length){$('items').innerHTML='<div class="muted">No IOUs yet.</div>';return}$('items').innerHTML=s.ious.map(i=>`<button class="item" style="text-align:left;color:inherit" onclick="openIou('${i.id}')"><b>${fmt(i.amount)} · ${esc(i.note)}</b><span class="muted">${i.role==='debtor'?'You owe @'+esc(i.creditorUsername):'@'+esc(i.debtorUsername)+' owes you'} · ${esc(i.status)}</span>${i.dueDate?`<div class="due ${dueClass(i)}">Due ${new Date(i.dueDate+'T00:00:00').toLocaleDateString()}</div>`:''}</button>`).join('')}
window.openIou=async id=>{try{const d=await api('/api/iou-detail?id='+encodeURIComponent(id));s.current=d.iou;renderDetail()}catch(e){msg(e.message,true)}};
function label(ev){const m={created:'IOU created',accept:'Accepted',decline:'Declined',cancel:'Cancelled',claim_paid:'Marked paid',confirm_paid:'Settlement confirmed',reject_payment_claim:'Payment claim rejected',note:'Activity note',partial_claimed:'Partial payment claimed',partial_confirmed:'Partial payment confirmed',partial_rejected:'Partial payment rejected',test_created:'Test IOU created',test_accept:'Simulated acceptance',test_claim_paid:'Simulated paid claim',test_confirm_paid:'Simulated settlement'};return m[ev.type]||String(ev.type||'Activity').replaceAll('_',' ')}
function renderDetail(){const i=s.current;if(!i)return;const pending=(i.partialPayments||[]).find(p=>p.status==='claimed');$('detail').classList.remove('hidden');$('picker').classList.add('hidden');$('detail').innerHTML=`<div class="card"><button class="btn ghost" onclick="backList()">← All IOUs</button><div class="row" style="align-items:start;margin-top:14px"><div><div class="amount">${fmt(i.amount)}</div><div class="muted">${i.role==='debtor'?'You owe @'+esc(i.creditorUsername):'@'+esc(i.debtorUsername)+' owes you'}</div></div><div class="status">${esc(i.status)}</div></div><h2>${esc(i.note)}</h2><div class="muted">Created ${new Date(i.createdAt).toLocaleString()}${i.dueDate?' · Due '+new Date(i.dueDate+'T00:00:00').toLocaleDateString():''}</div><div class="row" style="margin-top:16px"><div class="item"><span class="muted">Confirmed partials</span><b>${fmt(i.paidAmount)}</b></div><div class="item"><span class="muted">Remaining</span><b>${fmt(i.remainingAmount)}</b></div></div>${i.permissions.canClaimPartial?`<div class="card"><b>Record a partial payment claim</b><input id="partialAmount" type="number" step="0.0000001" min="0.0000001" max="${i.remainingAmount}" placeholder="Amount in Pi"><button class="btn secondary" onclick="partialClaim()">Claim partial payment</button></div>`:''}${i.permissions.canReviewPartial&&pending?`<div class="card"><b>Partial payment awaiting your confirmation</b><p>${fmt(pending.amount)}</p><div class="row"><button class="btn primary" onclick="partialReview('confirm_partial','${pending.id}')">Confirm</button><button class="btn danger" onclick="partialReview('reject_partial','${pending.id}')">Reject</button></div></div>`:''}${i.permissions.canAddNote?`<div class="card"><b>Add private shared activity note</b><textarea id="activityNote" maxlength="240" placeholder="Add context for both participants…"></textarea><button class="btn secondary" onclick="addNote()">Add note</button></div>`:''}<div class="card"><h3>Activity timeline</h3><div class="timeline">${[...(i.history||[])].reverse().map(e=>`<div class="event"><b>${esc(label(e))}${e.amount?` · ${fmt(e.amount)}`:''}</b>${e.text?`<div>${esc(e.text)}</div>`:''}<small>${esc(e.by||'system')} · ${new Date(e.at).toLocaleString()}</small></div>`).join('')||'<div class="muted">No activity.</div>'}</div></div>${i.permissions.canArchive?`<button class="btn ghost" onclick="archive('${i.archived?'unarchive':'archive'}')">${i.archived?'Unarchive':'Archive'} this closed IOU</button>`:''}</div>`}
window.backList=()=>{$('detail').classList.add('hidden');$('picker').classList.remove('hidden');s.current=null;msg('')};window.addNote=async()=>{const text=$('activityNote').value.trim();if(!text)return;try{const d=await api('/api/iou-detail',{method:'POST',body:JSON.stringify({id:s.current.id,action:'add_note',text})});s.current=d.iou;renderDetail()}catch(e){msg(e.message,true)}};window.partialClaim=async()=>{try{const amount=$('partialAmount').value;const d=await api('/api/iou-detail',{method:'POST',body:JSON.stringify({id:s.current.id,action:'claim_partial',amount})});s.current=d.iou;renderDetail()}catch(e){msg(e.message,true)}};window.partialReview=async(action,paymentId)=>{try{const d=await api('/api/iou-detail',{method:'POST',body:JSON.stringify({id:s.current.id,action,paymentId})});s.current=d.iou;renderDetail()}catch(e){msg(e.message,true)}};window.archive=async action=>{try{const d=await api('/api/iou-detail',{method:'POST',body:JSON.stringify({id:s.current.id,action})});s.current=d.iou;renderDetail()}catch(e){msg(e.message,true)}};
</script></body></html>
