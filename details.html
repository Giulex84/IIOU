<!doctype html><html lang="en" data-app="iiou"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101e"><title>IIOU Activity — Testnet</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><script src="/locales.js" defer></script><script src="/i18n.js" defer></script><style>:root{--bg:#07101e;--panel:#0e1a2c;--line:#223553;--text:#f7f9fc;--muted:#9db0c9;--mint:#37d4b2;--gold:#ffd166;--blue:#66a7ff;--danger:#ff7383}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#173358 0,transparent 30%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.wrap{width:min(760px,100%);margin:auto;padding:26px 14px 90px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.badge{border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:var(--mint);font-size:12px;font-weight:800}.muted{color:var(--muted);line-height:1.5}.card{background:linear-gradient(145deg,#10203a,#0b1728);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:16px}.primary,.secondary,.ghost,.danger{border:0;border-radius:14px;padding:13px 15px;font-weight:800}.primary{background:var(--mint);color:#06121d}.secondary{background:#1a3150;color:var(--text);border:1px solid #2b4a71}.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.danger{background:#3a1b28;color:#ffc0c9;border:1px solid #663142}.wide{width:100%}.hidden{display:none!important}.list{display:grid;gap:10px}.item{padding:15px;border:1px solid var(--line);border-radius:16px;background:#0a1727;cursor:pointer}.item b{font-size:18px}.amount{font-size:34px;font-weight:900}.status{font-size:11px;font-weight:900;text-transform:uppercase;padding:7px 9px;border-radius:999px;background:#16263b;color:var(--muted)}.status.proposed{color:var(--gold)}.status.accepted{color:var(--blue)}.status.payment_claimed{color:#ffb86b}.status.settled{color:var(--mint)}.status.declined,.status.cancelled{color:#a8b7c9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:14px;border:1px solid var(--line);border-radius:16px;background:#0a1727}.metric span{color:var(--muted);font-size:12px}.metric b{display:block;margin-top:6px;font-size:20px}.receipt{border-color:#245c50;background:#0b2a24}.timeline{border-left:2px solid #29476c;margin:14px 0 0 12px;padding-left:18px}.event{position:relative;margin:0 0 22px}.event:before{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--blue);left:-25px;top:5px}.event strong{display:block}.event small{display:block;color:var(--muted);margin-top:5px}.field{margin:12px 0}.field textarea,.field input{width:100%;background:#081524;color:var(--text);border:1px solid #29405f;border-radius:13px;padding:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1;min-width:140px}.back{display:inline-block;margin:18px 0;color:var(--muted);text-decoration:none}.stepbox{padding:15px;border-radius:16px;border:1px solid #2a4160;background:#0a1727;margin-top:14px}.stepbox b{display:block;margin-bottom:6px}.stepbox.good{border-color:#245c50;background:#0b2a24}.stepbox.warn{border-color:#66511f;background:#251f10}.stepbox.danger{border-color:#663142;background:#2b1720}.helper{font-size:13px;color:var(--muted);line-height:1.5;margin-top:8px}.due-over{color:var(--danger);font-weight:800}.due-soon{color:var(--gold);font-weight:800}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style><style>.wrap{padding-top:18px;padding-bottom:40px}.card{padding:14px;margin-top:12px;border-radius:18px}.card h2{font-size:22px;line-height:1.25;margin:12px 0}.card h3{font-size:18px;margin:0 0 8px}.amount{font-size:30px}.stepbox{padding:11px;margin-top:10px}.metric{padding:10px}.grid{grid-template-columns:1fr 1fr!important;gap:8px}.metric b{font-size:18px}.back{margin:12px 0}.compact-group>summary{cursor:pointer;font-size:17px;font-weight:700;line-height:1.4;list-style-position:inside}.compact-group>.card{border:0;background:none;padding:12px 0 0;margin-top:0}.compact-group>.card h3{display:none}.compact-group>.card h2{display:none}.compact-plan{font-size:13px;color:var(--muted);margin:10px 0 0}#detail>button:first-child{width:auto;padding:8px 10px;margin-top:8px}.top h1{font-size:25px}.top h1+.muted{font-size:13px}</style></head><body><main class="wrap"><div class="top"><div><h1 style="margin:0">IIOU Activity</h1><div class="muted">Details, confirmations and settlement history</div></div><span class="badge">PI TESTNET</span></div><a class="back" href="/">← Back to IIOU</a><section id="loginCard" class="card"><h2>Private activity center</h2><p class="muted">Authenticate with Pi to view only IOUs connected to your verified account.</p><button id="login" class="primary wide">Continue with Pi</button></section><section id="content" class="hidden"><div id="listCard" class="card"><h2>Your IOUs</h2><p class="muted">Open an IOU to review its full state, timeline and the actions available to you.</p><div id="list" class="list"></div></div><div id="detail" class="hidden"></div></section></main><script>
Pi.init({version:'2.0',sandbox:true});let token=null,user=null,ious=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>`${Number(n||0).toLocaleString(window.APP_I18N?.locale(),{maximumFractionDigits:7})} π`;const H=()=>({'Content-Type':'application/json',Authorization:`Bearer ${token}`});async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{...H(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d}const label=t=>({created:'IOU created',terms_set:'Agreement terms set',recurring_cycle_created:'Recurring cycle created',reminder_sent:'Reminder sent',accept:'Counterparty accepted',decline:'Counterparty declined',cancel:'IOU cancelled',claim_paid:'Debtor marked paid',confirm_paid:'Settlement confirmed',reject_payment_claim:'Payment claim rejected',note:'Shared note',partial_claimed:'Partial payment claimed',partial_confirmed:'Partial payment confirmed',partial_rejected:'Partial payment rejected',close_requested:'Closure requested',close_confirmed:'Closure confirmed',close_rejected:'Closure rejected',close_cancelled:'Closure request cancelled'}[t]||String(t||'').replaceAll('_',' '));const nice=s=>({proposed:'Awaiting reply',accepted:'Accepted',payment_claimed:'Payment claimed',settled:'Settled',declined:'Declined',cancelled:'Cancelled',closure_requested:'Closure requested',closed_by_agreement:'Closed by agreement'}[s]||s);
function dueState(i){if(!i.dueDate)return{text:'No due date',cls:''};const d=new Date(i.dueDate+'T00:00:00');if(['settled','declined','cancelled'].includes(i.status))return{text:'Due '+d.toLocaleDateString(window.APP_I18N?.locale()),cls:''};const t=new Date();t.setHours(0,0,0,0);const days=Math.ceil((d-t)/86400000);if(days<0)return{text:`Overdue by ${Math.abs(days)} day${Math.abs(days)===1?'':'s'}`,cls:'due-over'};if(days===0)return{text:'Due today',cls:'due-soon'};if(days<=3)return{text:`Due in ${days} day${days===1?'':'s'}`,cls:'due-soon'};return{text:'Due '+d.toLocaleDateString(window.APP_I18N?.locale()),cls:''}}
function stateGuide(i){if(i.status==='proposed'){const mine=i.creatorUsername?.toLowerCase()===user.username.toLowerCase();return mine?{cls:'warn',title:'Waiting for the other Pioneer',text:'This IOU becomes active only after the counterparty accepts the shared record.'}:{cls:'warn',title:'Your confirmation is needed',text:'Review the amount, direction and note. Accept only if the record is correct.'}}if(i.status==='accepted')return{cls:'',title:'Active IOU',text:i.role==='debtor'?'When you have paid outside IIOU, mark the payment here so the creditor can confirm settlement.':'The debtor can mark a payment as made. You remain in control of the final settlement confirmation.'};if(i.status==='payment_claimed')return i.role==='creditor'?{cls:'warn',title:'Settlement confirmation needed',text:'The debtor says the IOU has been paid. Confirm only after you have actually received the value.'}:{cls:'warn',title:'Waiting for creditor confirmation',text:'You marked this IOU as paid. It remains open until the creditor confirms receipt.'};if(i.status==='closure_requested')return{cls:'warn',title:'Closure awaiting confirmation',text:'This IOU remains open until the other participant confirms. No payment has been recorded.'};if(i.status==='closed_by_agreement')return{cls:'good',title:'Closed by mutual agreement',text:'This IOU was closed without recording a settlement.'};if(i.status==='settled')return{cls:'good',title:'Settlement complete',text:'Both sides completed the confirmation flow. This receipt remains in the shared history.'};if(i.status==='declined')return{cls:'',title:'IOU declined',text:'The counterparty did not accept this proposed record. No settlement obligation is recorded by IIOU.'};return{cls:'',title:'IOU cancelled',text:'This proposal was cancelled before acceptance.'}}
async function login(){const b=$('login');if(b.disabled)return;b.disabled=true;b.textContent='Connecting to Pi…';try{const a=await Pi.authenticate(['username'],()=>{});token=a.accessToken;b.textContent='Loading your agreements…';const d=await api('/api/auth',{method:'POST'});user=d.user;ious=d.ious||[];$('loginCard').classList.add('hidden');$('content').classList.remove('hidden');renderList();const id=new URLSearchParams(location.search).get('id');if(id)openDetail(id)}catch(e){b.disabled=false;b.textContent='Continue with Pi';throw e}}async function loadList(){const d=await api('/api/ious');ious=d.ious||[];renderList()}function renderList(){$('list').innerHTML=ious.length?ious.map(i=>{const ds=dueState(i);return `<div class="item" onclick="openDetail('${i.id}')"><div class="top"><b>${fmt(i.amount)} · <span translate="no">${esc(i.note)}</span></b><span class="status ${esc(i.status)}">${esc(nice(i.status))}</span></div><div class="muted" style="margin-top:6px">${i.role==='debtor'?`You owe @${esc(i.creditorUsername)}`:`@${esc(i.debtorUsername)} owes you`}</div><div class="${ds.cls}" style="margin-top:6px;font-size:13px">${esc(ds.text)}</div></div>`}).join(''):'<div class="muted">No IOUs yet.</div>'}async function openDetail(id){const d=await api('/api/iou-detail?id='+encodeURIComponent(id));renderDetail(d.iou);history.replaceState(null,'','/details.html?id='+encodeURIComponent(id))}window.openDetail=openDetail;
function renderDetail(i){$('listCard').classList.add('hidden');const other=i.role==='debtor'?i.creditorUsername:i.debtorUsername;const receipt=i.status==='settled'?`<div class="card receipt"><h3 style="color:var(--mint);margin-top:0">Settlement receipt</h3><div class="grid"><div class="metric"><span>Settled amount</span><b>${fmt(i.amount)}</b></div><div class="metric"><span>Completed</span><b style="font-size:15px">${i.settledAt?new Date(i.settledAt).toLocaleString(window.APP_I18N?.locale()):'Confirmed'}</b></div></div><p class="helper">IIOU records the mutual confirmation only. It is not a bank, escrow service or blockchain settlement processor.</p></div>`:'';const pending=(i.partialPayments||[]).find(p=>p.status==='claimed');const guide=stateGuide(i);const ds=dueState(i);const controls=[];const amCreator=i.creatorUsername?.toLowerCase()===user.username.toLowerCase();const amCounterparty=i.counterpartyUsername?.toLowerCase()===user.username.toLowerCase();if(i.status==='proposed'&&amCounterparty)controls.push(`<div class="card"><h3>Review this proposal</h3><p class="muted">Accept only if the amount, direction and note match what you agreed with @${esc(i.creatorUsername)}.</p><div class="actions"><button class="primary" onclick="stateAction('${i.id}','accept')">Accept IOU</button><button class="danger" onclick="stateAction('${i.id}','decline')">Decline</button></div></div>`);if(i.status==='proposed'&&amCreator)controls.push(`<div class="card"><h3>Waiting for a reply</h3><p class="muted">You can cancel this proposal while it is still awaiting confirmation.</p><button class="ghost wide" onclick="stateAction('${i.id}','cancel')">Cancel proposal</button></div>`);if(i.status==='accepted'&&i.role==='debtor')controls.push(`<div class="card"><h3>Ready to record payment?</h3><p class="muted">Only mark this as paid after the real-world value has been transferred. The creditor must still confirm receipt.</p><button class="secondary wide" onclick="stateAction('${i.id}','claim_paid')">Mark full amount as paid</button></div>`);if(i.status==='payment_claimed'&&i.role==='creditor')controls.push(`<div class="card"><h3>Confirm settlement</h3><p class="muted">The debtor reports that the full amount was paid. Confirm only after you have actually received it.</p><div class="actions"><button class="primary" onclick="stateAction('${i.id}','confirm_paid')">Confirm received</button><button class="danger" onclick="stateAction('${i.id}','reject_payment_claim')">Not received yet</button></div></div>`);if(i.permissions.canAddNote)controls.push(`<div class="card"><h3>Add shared activity note</h3><div class="field"><textarea id="noteText" maxlength="240" placeholder="Add context visible to both participants…"></textarea></div><button class="secondary wide" onclick="postAction('${i.id}','add_note',{text:$('noteText').value})">Add note</button></div>`);if(i.permissions.canClaimPartial)controls.push(`<div class="card"><h3>Record a partial payment</h3><p class="muted">Use this only after part of the amount has actually been transferred.</p><div class="field"><input id="partialAmount" type="number" min="0.0000001" step="0.0000001" placeholder="Amount in Test-Pi"></div><button class="secondary wide" onclick="postAction('${i.id}','claim_partial',{amount:$('partialAmount').value})">Claim partial payment</button></div>`);if(i.permissions.canReviewPartial&&pending)controls.push(`<div class="card"><h3>Review partial payment</h3><p class="muted">${fmt(pending.amount)} claimed by @${esc(pending.claimedBy)}</p><div class="actions"><button class="primary" onclick="postAction('${i.id}','confirm_partial',{paymentId:'${pending.id}'})">Confirm received</button><button class="danger" onclick="postAction('${i.id}','reject_partial',{paymentId:'${pending.id}'})">Reject claim</button></div></div>`);if(i.permissions.canArchive)controls.push(`<div class="card"><button class="ghost wide" onclick="postAction('${i.id}','${i.archived?'unarchive':'archive'}')">${i.archived?'Unarchive':'Archive'} this closed IOU</button></div>`);$('detail').innerHTML=`<button class="ghost wide" onclick="showList()">← All IOUs</button><div class="card"><div class="top"><div><div class="amount">${fmt(i.amount)}</div><div class="muted">${i.role==='debtor'?`You owe @${esc(other)}`:`@${esc(other)} owes you`}</div></div><span class="status ${esc(i.status)}">${esc(nice(i.status))}</span></div><h2 translate="no">${esc(i.note)}</h2><div class="muted">Created ${new Date(i.createdAt).toLocaleString(window.APP_I18N?.locale())}</div><div class="${ds.cls}" style="margin-top:8px">${esc(ds.text)}</div><div class="stepbox ${guide.cls}"><b>${esc(guide.title)}</b><div class="muted">${esc(guide.text)}</div></div><div class="grid" style="margin-top:16px"><div class="metric"><span>Confirmed partials</span><b>${fmt(i.paidAmount)}</b></div><div class="metric"><span>Remaining</span><b>${fmt(i.remainingAmount)}</b></div></div></div>${controls.join('')}${receipt}<div class="card"><h2>Activity timeline</h2><p class="muted">Newest activity appears first.</p><div class="timeline">${[...(i.history||[])].reverse().map(e=>`<div class="event"><strong>${esc(label(e.type))}</strong><small translate="no">${e.by?'@'+esc(e.by):''} · ${new Date(e.at).toLocaleString(window.APP_I18N?.locale())}${e.text?'<br>'+esc(e.text):''}${e.amount!=null?'<br>'+fmt(e.amount):''}</small></div>`).join('')||'<div class="muted">No activity yet.</div>'}</div></div>`;$('detail').classList.remove('hidden')}
async function stateAction(id,action){try{await api('/api/iou-action',{method:'POST',body:JSON.stringify({id,action})});const d=await api('/api/iou-detail?id='+encodeURIComponent(id));renderDetail(d.iou);await loadListSilently()}catch(e){alert(e.message)}}window.stateAction=stateAction;async function loadListSilently(){try{const d=await api('/api/ious');ious=d.ious||[]}catch{}}async function postAction(id,action,extra={}){try{const d=await api('/api/iou-detail',{method:'POST',body:JSON.stringify({id,action,...extra})});renderDetail(d.iou);await loadListSilently()}catch(e){alert(e.message)}}window.postAction=postAction;function showList(){$('detail').classList.add('hidden');$('listCard').classList.remove('hidden');loadList();history.replaceState(null,'','/details.html')}window.showList=showList;$('login').onclick=()=>login().catch(e=>alert(e.message));
</script><script>
const baseRenderDetail=renderDetail;
renderDetail=function(i){baseRenderDetail(i);const terms=[i.recurrence?.frequency&&i.recurrence.frequency!=='none'?`Repeats ${i.recurrence.frequency} · cycle ${i.recurrence.cycle||1}`:'One-time agreement',i.installmentPlan?`${i.installmentPlan.count} installments · ${fmt(i.installmentPlan.suggestedAmount)} suggested each`:null].filter(Boolean).join(' · ');const summary=document.createElement('div');summary.className='card';summary.innerHTML=`<h3>Agreement plan</h3><p class="muted">${esc(terms)}</p>`;const first=$('detail').querySelector('.card');first?.after(summary);if(i.permissions?.canRemind){const reminder=document.createElement('div');reminder.className='card';reminder.innerHTML=`<h3>Send a respectful reminder</h3><p class="muted">The other participant will see it in this private agreement. To prevent pressure or spam, each person can send one reminder every 72 hours.</p><button class="secondary wide" id="sendReminder">Send reminder</button>`;summary.after(reminder);$('sendReminder').onclick=()=>postAction(i.id,'send_reminder')}};
</script><script>
const renderBeforeMutualClose=renderDetail;
renderDetail=function(i){renderBeforeMutualClose(i);const target=$('detail');if(!i||!target)return;const p=i.permissions||{};let html='';if(p.canRequestClose)html=`<div class="card"><h3>Close without settlement</h3><p class="muted">Use this when the IOU was created by mistake, is a duplicate, or the agreement was cancelled. This does not record a payment. The other participant must confirm.</p><div class="field"><select id="closeReason" style="width:100%;background:#081524;color:var(--text);border:1px solid #29405f;border-radius:13px;padding:13px"><option value="created_by_mistake">Created by mistake</option><option value="duplicate">Duplicate</option><option value="agreement_cancelled">Agreement cancelled</option><option value="other">Other reason</option></select><textarea id="closeNote" maxlength="160" placeholder="Optional explanation…"></textarea></div><button id="requestCloseBtn" class="ghost wide" onclick="requestClose('${i.id}')">Request closure without payment</button></div>`;else if(p.canReviewClose)html=`<div class="card"><h3>Closure request</h3><p class="muted">@${esc(i.closeRequest?.requestedBy)} asks to close this IOU without recording payment. Reason: ${esc(String(i.closeRequest?.reason||'other').replaceAll('_',' '))}${i.closeRequest?.text?'<br><span translate="no">'+esc(i.closeRequest.text)+'</span>':''}</p><div class="actions"><button class="primary" onclick="postAction('${i.id}','confirm_close')">Confirm closure</button><button class="danger" onclick="postAction('${i.id}','reject_close')">Keep IOU active</button></div></div>`;else if(p.canCancelClose)html=`<div class="card"><h3>Closure awaiting confirmation</h3><p class="muted">The IOU remains open until the other participant confirms. No payment has been recorded.</p><button class="ghost wide" onclick="postAction('${i.id}','cancel_close')">Cancel closure request</button></div>`;else if(i.status==='closed_by_agreement')html=`<div class="card receipt"><h3 style="color:var(--mint);margin-top:0">Closed by mutual agreement</h3><p class="muted">Closed without settlement. No payment was recorded and no recurring cycle was created.</p></div>`;if(html){const timeline=target.querySelector('.timeline')?.closest('.card');if(timeline)timeline.insertAdjacentHTML('beforebegin',html);else target.insertAdjacentHTML('beforeend',html)}};
window.requestClose=async id=>{const b=$('requestCloseBtn');if(b?.disabled)return;if(b){b.disabled=true;b.textContent='Sending request…'}await postAction(id,'request_close',{reason:$('closeReason').value,text:$('closeNote').value})};
</script>
<script>
const renderBeforeSharing=renderDetail;
renderDetail=function(i){renderBeforeSharing(i);if(!i)return;const target=$('detail'),card=document.createElement('div');card.className='card';const group=i.split?'<p class="muted"><span>Shared expense</span> “'+'<span translate="no">'+esc(i.split.title)+'</span>'+'” · '+i.split.participantCount+' shares · '+fmt(i.split.total)+' total</p>':'<p class="muted">Send this private request to the other participant. Authentication and participant access are still required.</p>';card.innerHTML='<h3>'+(i.split?'Shared expense':'Share this request')+'</h3>'+group+'<button class="secondary wide" id="shareAgreement">Share agreement link</button>';const timeline=target.querySelector('.timeline')?.closest('.card');if(timeline)timeline.before(card);else target.append(card);$('shareAgreement').onclick=()=>shareAgreement(i)};
async function shareAgreement(i){const url=location.origin+'/details.html?id='+encodeURIComponent(i.id),data={title:'IIOU · '+i.note,text:(i.split?'Your share: ':'Agreement: ')+fmt(i.amount),url};if(navigator.share){try{await navigator.share(data);return}catch(e){if(e?.name==='AbortError')return}}await navigator.clipboard.writeText(url);alert('Private agreement link copied.')}
</script>
<script>
const renderBeforeCompact=renderDetail;
renderDetail=function(i){renderBeforeCompact(i);if(!i)return;const target=$('detail'),cards=[...target.children].filter(x=>x.classList.contains('card')),summary=cards[0],plan=cards[1];
if(plan){if((!i.recurrence?.frequency||i.recurrence.frequency==='none')&&!i.installmentPlan){const text=document.createElement('p');text.className='compact-plan';text.textContent='One-time agreement';summary.append(text);plan.remove()}else fold(plan,'Agreement plan')}
for(const card of cards.slice(2)){if(!card.isConnected)continue;if(card.querySelector('#sendReminder'))fold(card,'Send reminder');else if(card.querySelector('#noteText'))fold(card,'Add shared activity note');else if(card.querySelector('#requestCloseBtn'))fold(card,'Close without settlement');else if(card.querySelector('#shareAgreement'))fold(card,'Share this request');else if(card.querySelector('.timeline'))fold(card,'Activity timeline')}
function fold(card,title){const group=document.createElement('details'),label=document.createElement('summary');group.className='card compact-group';label.textContent=title;card.before(group);group.append(label,card)}
};
</script>
<script>
const renderBeforeLanguageChange=renderDetail;let lastLanguageDetail=null;renderDetail=function(i){lastLanguageDetail=i;renderBeforeLanguageChange(i)};window.addEventListener('app-language-change',()=>{if(lastLanguageDetail)renderDetail(lastLanguageDetail);renderList()});
</script>
</body></html>
