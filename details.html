<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101e"><title>IIOU Activity</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><script src="/i18n.js" defer></script>
<style>
:root{--bg:#07101e;--panel:#0e1a2c;--line:#223553;--text:#f7f9fc;--muted:#9db0c9;--accent:#37d4b2;--blue:#66a7ff;--warn:#ffd166;--danger:#ff8592}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:760px;margin:auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-size:24px;font-weight:900}.pill{border:1px solid var(--line);padding:7px 10px;border-radius:999px;color:var(--warn);font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}.muted{color:var(--muted)}button,input,textarea{font:inherit}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;margin-top:10px}.primary{background:var(--accent);color:#06121d}.secondary{background:#1a3150;color:var(--text);border:1px solid #2b4a71}.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.danger{background:#3b1c29;color:#ffc3cc;border:1px solid #653044}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.amount{font-size:34px;font-weight:900}.status{text-transform:uppercase;font-size:12px;font-weight:900;color:var(--accent)}.list{display:grid;gap:10px}.item{padding:15px;border:1px solid var(--line);border-radius:16px;background:#0a1728}.item b{display:block;margin-bottom:4px}.timeline{border-left:2px solid #29405f;margin-left:9px;padding-left:16px}.event{position:relative;padding:0 0 20px}.event:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--blue);left:-22px;top:6px}.event b{display:block;line-height:1.35;margin-bottom:4px}.event small{display:block;color:var(--muted);line-height:1.4}.event .event-note{margin:5px 0;color:#dce7f5;line-height:1.45}.receipt{background:#0b211f;border-color:#245c50}.receipt strong{color:var(--accent)}textarea,input{width:100%;background:#081524;color:var(--text);border:1px solid #29405f;border-radius:13px;padding:12px;margin-top:8px}.hidden{display:none}.notice{padding:12px;border:1px solid var(--line);border-radius:14px;color:var(--muted);margin:12px 0}.notice.err{color:#ffc3cc;border-color:#653044}.back{color:var(--muted);text-decoration:none}.due.overdue{color:var(--danger);font-weight:800}.due.soon{color:var(--warn);font-weight:800}@media(max-width:520px){.shell{padding-left:12px;padding-right:12px}.top{align-items:flex-start}.brand{font-size:22px}.card{padding:16px}.amount{font-size:32px}}
</style></head>
<body><main class="shell"><div class="top"><div><div class="brand">IIOU Activity</div><div class="muted">Details, timeline and settlement history</div></div><span class="pill">TESTNET</span></div><a class="back" href="/">← Back to IIOU</a>
<section id="loginCard" class="card"><h2>Private activity center</h2><p class="muted">Authenticate with Pi to view only IOUs connected to your verified account.</p><button id="login" class="btn primary">Continue with Pi</button></section>
<section id="app" class="hidden"><div id="notice"></div><div id="picker" class="card"><h2>Your IOUs</h2><div id="items" class="list"></div></div><div id="detail" class="hidden"></div></section></main>
<script>
Pi.init({version:'2.0',sandbox:true});const s={token:null,user:null,ious:[],current:null};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const fmt=n=>`${Number(n||0).toLocaleString(undefined,{maximumFractionDigits:7})} π`;const headers=()=>({'Content-Type':'application/json','Authorization':`Bearer ${s.token}`});
function msg(t,e=false){$('notice').innerHTML=t?`<div class="notice ${e?'err':''}">${esc(t)}</div>`:''}async function api(url,o={}){const r=await fetch(url,{...o,headers:{...headers(),...(o.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d}
$('login').onclick=async()=>{const b=$('login');if(b.disabled)return;b.disabled=true;b.textContent='Connecting to Pi…';try{const a=await Pi.authenticate(['username','payments'],()=>{});s.token=a.accessToken;b.textContent='Loading your agreements…';const me=await api('/api/auth',{method:'POST'});s.user=me.user;s.ious=me.ious||[];$('loginCard').classList.add('hidden');$('app').classList.remove('hidden');renderList();const id=new URLSearchParams(location.search).get('id');if(id)await openIou(id)}catch(e){b.disabled=false;b.textContent='Continue with Pi';alert(e.message)}};
async function load(){const d=await api('/api/ious');s.ious=d.ious||[];renderList()}
function dueClass(i){if(!i.dueDate||['settled','declined','cancelled'].includes(i.status))return'';const x=new Date(i.dueDate+'T23:59:59'),now=new Date(),days=(x-now)/86400000;if(days<0)return'overdue';if(days<=3)return'soon';return''}
function renderList(){if(!s.ious.length){$('items').innerHTML='<div class="muted">No IOUs yet.</div>';return}$('items').innerHTML=s.ious.map(i=>`<button class="item" style="text-align:left;color:inherit" onclick="openIou('${i.id}')"><b>${fmt(i.amount)} · ${esc(i.note)}</b><span class="muted">${i.role==='debtor'?'You owe @'+esc(i.creditorUsername):'@'+esc(i.debtorUsername)+' owes you'} · ${esc(i.status)}</span>${i.dueDate?`<div class="due ${dueClass(i)}">Due ${new Date(i.dueDate+'T00:00:00').toLocaleDateString()}</div>`:''}</button>`).join('')}
window.openIou=async id=>{try{const d=await api('/api/iou-detail?id='+encodeURIComponent(id));s.current=d.iou;renderDetail()}catch(e){msg(e.message,true)}};
function label(ev){const m={created:'IOU created',accept:'IOU accepted',decline:'IOU declined',cancel:'IOU cancelled',claim_paid:'Debtor marked as paid',confirm_paid:'Settlement confirmed',reject_payment_claim:'Payment claim rejected',note:'Shared activity note',partial_claimed:'Partial payment claimed',partial_confirmed:'Partial payment confirmed',partial_rejected:'Partial payment rejected',test_created:'Test IOU created',test_accept:'Simulated counterparty acceptance',test_counterparty_accept:'Simulated counterparty acceptance',test_claim_paid:'Simulated paid claim',test_debtor_claim_paid:'Simulated debtor paid claim',test_confirm_paid:'Simulated settlement',test_creditor_confirm_paid:'Simulated creditor settlement confirmation'};return m[ev.type]||String(ev.type||'Activity').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase())}
function renderDetail(){const i=s.current;if(!i)return;const pending=(i.partialPayments||[]).find(p=>p.status==='claimed');const receipt=i.status==='settled'?`<div class="card receipt"><strong>Settlement receipt</strong><p>Final status: Settled</p><div class="muted">Settled amount ${fmt(i.amount)}${i.settledAt?' · '+new Date(i.settledAt).toLocaleString():''}</div></div>`:'';$('detail').classList.remove('hidden');$('picker').classList.add('hidden');$('detail').innerHTML=`<div class="card"><button class="btn ghost" onclick="backList()">← All IOUs</button><div class="row" style="align-items:start;margin-top:14px"><div><div class="amount">${fmt(i.amount)}</div><div class="muted">${i.role==='debtor'?'You owe @'+esc(i.creditorUsername):'@'+esc(i.debtorUsername)+' owes you'}</div></div><div class="status">${esc(i.status)}</div></div><h2>${esc(i.note)}</h2><div class="muted">Created ${new Date(i.createdAt).toLocaleString()}${i.dueDate?' · Due '+new Date(i.dueDate+'T00:00:00').toLocaleDateString():''}</div><div class="row" style="margin-top:16px"><div class="item"><span class="muted">Confirmed partials</span><b>${fmt(i.paidAmount)}</b></div><div class="item"><span class="muted">Remaining</span><b>${fmt(i.remainingAmount)}</b></div></div>${receipt}${i.permissions.canClaimPartial?`<div class="card"><b>Record a partial payment claim</b><input id="partialAmount" type="number" step="0.0000001" min="0.0000001" max="${i.remainingAmount}" placeholder="Amount in Pi"><button class="btn secondary" onclick="partialClaim()">Claim partial payment</button></div>`:''}${i.permissions.canReviewPartial&&pending?`<div class="card"><b>Partial payment awaiting your confirmation</b><p>${fmt(pending.amount)}</p><div class="row"><button class="btn primary" onclick="partialReview('confirm_partial','${pending.id}')">Confirm</button><button class="btn danger" onclick="partialReview('reject_partial','${pending.id}')">Reject</button></div></div>`:''}${i.permissions.canAddNote?`<div class="card"><b>Add private shared activity note</b><textarea id="activityNote" maxlength="240" placeholder="Add context for both participants…"></textarea><button class="btn secondary" onclick="addNote()">Add note</button></div>`:''}<div class="card"><h3>Activity timeline</h3><div class="timeline">${[...(i.history||[])].reverse().map(e=>`<div class="event"><b>${esc(label(e))}${e.amount?` · ${fmt(e.amount)}`:''}</b>${e.text?`<div class="event-note">${esc(e.text)}</div>`:''}<small>${esc(e.by||'system')} · ${new Date(e.at).toLocaleString()}</small></div>`).join('')||'<div class="muted">No activity.</div>'}</div></div>${i.permissions.canArchive?`<button class="btn ghost" onclick="archive('${i.archived?'unarchive':'archive'}')">${i.archived?'Unarchive':'Archive'} this closed IOU</button>`:''}</div>`}
window.backList=()=>{$('detail').classList.add('hidden');$('picker').classList.remove('hidden');s.current=null;msg('')};window.addNote=async()=>{const text=$('activityNote').value.trim();if(!text)return;try{const d=await api('/api/iou-detail',{method:'POST',body:JSON.stringify({id:s.current.id,action:'add_note',text})});s.current=d.iou;renderDetail()}catch(e){msg(e.message,true)}};window.partialClaim=async()=>{try{const amount=$('partialAmount').value;const d=await api('/api/iou-detail',{method:'POST',body:JSON.stringify({id:s.current.id,action:'claim_partial',amount})});s.current=d.iou;renderDetail()}catch(e){msg(e.message,true)}};window.partialReview=async(action,paymentId)=>{try{const d=await api('/api/iou-detail',{method:'POST',body:JSON.stringify({id:s.current.id,action,paymentId})});s.current=d.iou;renderDetail()}catch(e){msg(e.message,true)}};window.archive=async action=>{try{const d=await api('/api/iou-detail',{method:'POST',body:JSON.stringify({id:s.current.id,action})});s.current=d.iou;renderDetail()}catch(e){msg(e.message,true)}};
</script><script>
const baseRenderDetailV25=renderDetail;
renderDetail=function(){baseRenderDetailV25();const i=s.current;if(!i)return;const terms=[i.recurrence?.frequency&&i.recurrence.frequency!=='none'?`Repeats ${i.recurrence.frequency} · cycle ${i.recurrence.cycle||1}`:'One-time agreement',i.installmentPlan?`${i.installmentPlan.count} installments · ${fmt(i.installmentPlan.suggestedAmount)} suggested each`:null].filter(Boolean).join(' · ');const summary=document.createElement('div');summary.className='card';summary.innerHTML=`<b>Agreement plan</b><p class="muted">${esc(terms)}</p>`;const first=$('detail').querySelector('.card');first?.after(summary);if(i.permissions?.canRemind){const reminder=document.createElement('div');reminder.className='card';reminder.innerHTML='<b>Send a respectful reminder</b><p class="muted">Visible privately to the other participant. Limited to once every 72 hours per person.</p><button class="btn secondary" id="sendReminder">Send reminder</button>';summary.after(reminder);$('sendReminder').onclick=async()=>{try{const d=await api('/api/iou-detail',{method:'POST',body:JSON.stringify({id:i.id,action:'send_reminder'})});s.current=d.iou;renderDetail()}catch(e){msg(e.message,true)}}}};
</script><script>
const renderBeforeMutualClose=renderDetail;
renderDetail=function(){renderBeforeMutualClose();const i=s.current,target=$('detail');if(!i||!target)return;const p=i.permissions||{};let html='';if(p.canRequestClose)html=`<div class="card"><b>Close without settlement</b><p class="muted">Use this for a mistaken, duplicate or cancelled agreement. This does not record a payment. The other participant must confirm.</p><select id="closeReason" style="width:100%;background:#081524;color:var(--text);border:1px solid #29405f;border-radius:13px;padding:12px"><option value="created_by_mistake">Created by mistake</option><option value="duplicate">Duplicate</option><option value="agreement_cancelled">Agreement cancelled</option><option value="other">Other reason</option></select><textarea id="closeNote" maxlength="160" placeholder="Optional explanation…"></textarea><button id="requestCloseBtn" class="btn ghost" onclick="requestClose()">Request closure without payment</button></div>`;else if(p.canReviewClose)html=`<div class="card"><b>Closure request</b><p class="muted">@${esc(i.closeRequest?.requestedBy)} asks to close this IOU without recording payment. Reason: ${esc(String(i.closeRequest?.reason||'other').replaceAll('_',' '))}${i.closeRequest?.text?'<br>'+esc(i.closeRequest.text):''}</p><div class="row"><button class="btn primary" onclick="closeAction('confirm_close')">Confirm closure</button><button class="btn danger" onclick="closeAction('reject_close')">Keep active</button></div></div>`;else if(p.canCancelClose)html=`<div class="card"><b>Closure awaiting confirmation</b><p class="muted">No payment has been recorded.</p><button class="btn ghost" onclick="closeAction('cancel_close')">Cancel closure request</button></div>`;else if(i.status==='closed_by_agreement')html='<div class="card receipt"><strong>Closed by mutual agreement</strong><p class="muted">Closed without settlement. No payment was recorded and no recurring cycle was created.</p></div>';if(html)target.insertAdjacentHTML('afterbegin',html)};
window.closeAction=async action=>{try{const d=await api('/api/iou-detail',{method:'POST',body:JSON.stringify({id:s.current.id,action})});s.current=d.iou;renderDetail()}catch(e){msg(e.message,true)}};window.requestClose=()=>closeActionWithData();async function closeActionWithData(){const b=$('requestCloseBtn');if(b?.disabled)return;if(b){b.disabled=true;b.textContent='Sending request…'}try{const d=await api('/api/iou-detail',{method:'POST',body:JSON.stringify({id:s.current.id,action:'request_close',reason:$('closeReason').value,text:$('closeNote').value})});s.current=d.iou;renderDetail()}catch(e){msg(e.message,true)}}
</script>
<script>
const renderBeforeSharing=renderDetail;
renderDetail=function(){renderBeforeSharing();const i=s.current;if(!i)return;const target=$('detail'),card=document.createElement('div');card.className='card';const group=i.split?'<p class="muted">Part of “'+esc(i.split.title)+'” · '+i.split.participantCount+' shares · '+fmt(i.split.total)+' total</p>':'<p class="muted">Send this private request to the other participant. Authentication and participant access are still required.</p>';card.innerHTML='<b>'+(i.split?'Shared expense':'Share this request')+'</b>'+group+'<button class="btn secondary" id="shareAgreement">Share agreement link</button>';target.prepend(card);$('shareAgreement').onclick=()=>shareAgreement(i)};
async function shareAgreement(i){const url=location.origin+'/details.html?id='+encodeURIComponent(i.id),data={title:'IIOU · '+i.note,text:(i.split?'Your share: ':'Agreement: ')+fmt(i.amount),url};if(navigator.share){try{await navigator.share(data);return}catch(e){if(e?.name==='AbortError')return}}await navigator.clipboard.writeText(url);alert('Private agreement link copied.')}
</script>
</body></html>
