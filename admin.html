<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>IIOU Metrics</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#07101e;color:#fff;font:16px system-ui}.wrap{max-width:980px;margin:auto;padding:28px 16px}.hero{display:flex;align-items:center;gap:16px}.hero h1{margin:0}.badge{margin-left:auto;border:1px solid #37d4b2;color:#37d4b2;border-radius:999px;padding:8px 12px}.panel{margin-top:24px;padding:22px;background:#0e1a2c;border:1px solid #223553;border-radius:22px}.toolbar{display:flex;justify-content:space-between;gap:12px}select,button{padding:13px 16px;border-radius:14px;border:1px solid #304767;background:#14243b;color:#fff;font:inherit}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.card{padding:17px;background:#132139;border:1px solid #29405f;border-radius:18px;color:#9db0c9}.card b{display:block;color:#fff;font-size:32px;margin-top:7px}.table{overflow:auto;margin-top:20px;border:1px solid #29405f;border-radius:16px}table{width:100%;min-width:720px;border-collapse:collapse}th,td{padding:13px;border-bottom:1px solid #223553;text-align:right}th:first-child,td:first-child{text-align:left}.hidden{display:none}.status{color:#9db0c9}@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><div class="hero"><div style="font-size:42px">📊</div><div><h1>IIOU Metrics</h1><div class="status">Testnet · private aggregate telemetry</div></div><span class="badge">ADMIN</span></div><section id="login" class="panel"><h2>Owner access</h2><p class="status">Authenticate with Pi to view aggregate metrics.</p><button id="verify">VERIFY WITH PI</button></section><section id="dashboard" class="panel hidden"><div class="toolbar"><select id="days"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select><button id="refresh">Refresh</button></div><p id="status" class="status"></p><div class="cards"><div class="card">DAILY UNIQUES (SUM)<b id="users">0</b></div><div class="card">LOGINS<b id="logins">0</b></div><div class="card">IOUs CREATED<b id="created">0</b></div><div class="card">IOU ACTIONS<b id="actions">0</b></div><div class="card">SETTLED<b id="settled">0</b></div><div class="card">SUPPORT PAYMENTS<b id="payments">0</b></div></div><div class="table"><table><thead><tr><th>UTC day</th><th>Users</th><th>Logins</th><th>Created</th><th>Actions</th><th>Settled</th><th>Payments</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>Pi.init({version:'2.0',sandbox:true});let token='';const $=id=>document.getElementById(id),sum=(r,k)=>r.reduce((n,x)=>n+Number(x.events?.[k]||0),0);async function load(){try{$('status').textContent='Loading…';const r=await fetch('/api/metrics?days='+$('days').value,{headers:{Authorization:'Bearer '+token},cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Metrics request failed');const rows=d.rows||[];$('users').textContent=rows.reduce((n,x)=>n+Number(x.uniqueUsers||0),0);$('logins').textContent=sum(rows,'login');$('created').textContent=sum(rows,'iou_created');$('actions').textContent=sum(rows,'iou_action');$('settled').textContent=sum(rows,'iou_settled');$('payments').textContent=sum(rows,'support_payment');$('rows').innerHTML=rows.map(x=>`<tr><td>${x.day}</td><td>${x.uniqueUsers||0}</td><td>${x.events?.login||0}</td><td>${x.events?.iou_created||0}</td><td>${x.events?.iou_action||0}</td><td>${x.events?.iou_settled||0}</td><td>${x.events?.support_payment||0}</td></tr>`).join('');$('status').textContent='Updated '+new Date(d.generatedAt).toLocaleString()}catch(e){$('status').textContent=e.message}}$('verify').onclick=async()=>{try{const a=await Pi.authenticate(['username'],()=>{});token=a.accessToken;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await load()}catch(e){alert(e.message||'Pi authentication failed')}};$('refresh').onclick=load;$('days').onchange=load;</script></body></html>
